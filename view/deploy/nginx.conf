# EMPATHO — nginx 설정
# ════════════════════════════════════════════════════════════════
#
# 이 한 대가 세 가지를 한다.
#   1. 화면(dist)을 준다              /  · /hospital
#   2. /api 를 Django 로 넘긴다
#   3. /svc 를 Go 관문으로 넘긴다      파일 · 알림 스트림(SSE)
#
# **셋이 같은 주소에서 나온다는 것이 핵심이다.** 화면 코드가 주소를 하나도
# 안 박고 상대경로만 쓰는 이유가 이것이다(src/api.js 머리말). 같은 출처라
# 브라우저가 교차 출처로 보지 않고, 그래서 CORS 목록을 관리할 일이 없다.
#
#
# ── 쓰기 전에 고칠 곳 (⚠ 표시 네 군데) ─────────────────────────
#   ⚠1  server_name        도메인이 나오면 채운다
#   ⚠2  ssl_certificate    인증서 경로
#   ⚠3  root               빌드 결과(web-dist)가 놓인 자리
#   ⚠4  upstream 두 개     Django · Go 관문의 실제 주소
#
# 도메인이 아직 없다면 아래 「도메인 없이 미리 세워 두기」를 본다.
#
#
# ── 도메인 없이 미리 세워 두기 ─────────────────────────────────
# 지금은 도메인이 없어 공인 인증서를 못 받는다. 사설 IP(192.168.x.x)에는
# 어떤 인증기관도 발급하지 않는다 — 규정이라 우회할 수 없다.
#
# 그래서 **자체서명 인증서로 먼저 세워 둔다.** 구조는 그대로 두고 나중에
# 인증서 파일만 갈아 끼우면 된다. ⚠2 두 줄 말고는 고칠 것이 없다.
#
#   sudo mkdir -p /etc/nginx/ssl
#   sudo openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#     -keyout /etc/nginx/ssl/empatho.key \
#     -out    /etc/nginx/ssl/empatho.crt \
#     -subj "/CN=empatho.local" \
#     -addext "subjectAltName=IP:app-host,DNS:empatho.local"
#
# 브라우저가 「안전하지 않음」을 띄우지만 **HTTPS 자체는 켜진 것**이라,
# Secure 쿠키가 실리는지 · SSE 가 도는지 전부 지금 확인할 수 있다.
# 시연 자리에서 경고를 안 보이게 하려면 그 PC 에 위 .crt 를 신뢰할 수 있는
# 루트 인증서로 등록해 두면 된다.
#
# 도메인이 생긴 뒤:
#   sudo certbot --nginx -d empatho.example.com
# certbot 이 ⚠1 · ⚠2 를 알아서 고쳐 준다. 아래 .well-known 자리를 비워
# 둔 것이 그 때문이다.


# ⚠4 ── 뒤에 있는 두 서버 ───────────────────────────────────────
# 한 대에 같이 있으면 포트만 다르고, 나뉘어 있으면 주소를 적는다.
upstream empatho_django {
    server 127.0.0.1:8000;
    keepalive 32;
}

upstream empatho_gateway {
    server 127.0.0.1:8080;
    keepalive 32;
}


# ── 80 : 전부 https 로 보낸다 ──────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name _;                      # ⚠1 도메인이 나오면 채운다

    # certbot 이 인증서를 받을 때 이 자리로 확인 파일을 놓는다.
    # 리다이렉트보다 **위에** 있어야 한다 — 아래로 가면 https 로 튕겨서
    # 발급이 실패한다.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


# ── 443 : 진짜 자리 ────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name _;                      # ⚠1 도메인이 나오면 채운다

    # ⚠2 인증서 — 지금은 자체서명, certbot 을 돌리면 이 두 줄이 바뀐다
    ssl_certificate     /etc/nginx/ssl/empatho.crt;
    ssl_certificate_key /etc/nginx/ssl/empatho.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ⚠3 빌드 결과가 놓인 자리.
    #    npm run build 가 dist/ 로 내보내면 그것을 여기로 옮긴다(README).
    root /srv/empatho/web-dist;

    # 업로드 — 조직 이미지와 영상은 크다. 기본 1M 이면 바로 413 이 난다.
    client_max_body_size 512m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── 화면 ───────────────────────────────────────────────────
    #
    # ⚠ 입구가 **둘**이다. / 는 환자 앱, /hospital 은 병원 웹이고 서로 다른
    #   html 파일이다(README 참고). 한 곳으로 몰면 안 된다 — 병원 웹 주소로
    #   들어왔는데 환자 앱이 뜬다.
    #
    # 둘 다 SPA 라 «없는 파일이면 자기 입구 html 로» 돌려줘야 한다.
    # 그래야 /hospital/breast/patients/P-1/review 를 주소창에 바로 쳐도 열린다.

    location /hospital {
        try_files $uri $uri/ /hospital.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 이름에 해시가 박힌 파일은 내용이 바뀌면 이름도 바뀐다. 영구 캐시해도
    # 안전하고, 안 하면 방문할 때마다 같은 것을 다시 받는다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Django ─────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://empatho_django;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # ⚠ **이 줄이 빠지면 로그인이 안 된다.**
        #   Django 는 nginx 뒤에 있어서 자기 쪽으로 오는 것은 http 로 보인다.
        #   그러면 Secure 쿠키를 「https 가 아니니 못 준다」며 안 내려보낸다.
        #   refresh 토큰이 Secure + SameSite=None 이라 그대로 걸린다.
        #   Django 쪽에도 짝이 필요하다 (settings.py):
        #       SECURE_PROXY_SSL_HEADER = ("HTTP_X_FORWARDED_PROTO", "https")
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
    }

    # ── Go 관문 — 파일 ─────────────────────────────────────────
    # 조직 이미지·영상이 Django 를 거치지 않고 여기로 곧장 간다
    # (hospital/lib/files.js 참고).
    location /svc/ {
        proxy_pass http://empatho_gateway;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_request_buffering off;      # 큰 업로드를 디스크에 먼저 받지 않는다
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ── Go 관문 — 알림 스트림(SSE) ─────────────────────────────
    #
    # ⚠ **따로 잡아야 한다.** 위 /svc/ 설정 그대로 두면 알림이 안 온다.
    #   SSE 는 연결을 열어 두고 한 줄씩 흘려보내는 방식인데,
    #     · proxy_buffering 이 켜져 있으면 nginx 가 모아 두었다가 보낸다
    #       → 알림이 한참 뒤에 몰아서 오거나 아예 안 온다
    #     · 기본 읽기 시간(60초)이 지나면 nginx 가 연결을 끊는다
    #       → 1분마다 알림이 끊기고 브라우저가 다시 붙는다
    #   조용히 「알림이 좀 늦네」로 보여서 원인을 찾기 어렵다.
    location /svc/v1/notify/ {
        proxy_pass http://empatho_gateway;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        gzip off;                         # 압축도 모아 두게 만든다
        chunked_transfer_encoding off;
        proxy_read_timeout 24h;
    }
}
