name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, empatho-gpu]
    timeout-minutes: 15
    steps:
      - name: 배포 전 커밋 기록
        run: |
          set -e
          cd /home/wsuser/app
          echo "PREV_SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV
          echo "롤백 지점: $(git rev-parse --short HEAD)"

      - name: 문법 검사 및 배포
        run: |
          set -e
          cd /home/wsuser/app
          git pull --ff-only
          /usr/local/bin/python3.12 -m py_compile main.py
          /usr/local/bin/python3.12 -m pip install --user -q -r requirements.txt
          # restart 만으로는 supervisord.conf 변경이 반영되지 않는다.
          # reread 로 파일을 다시 읽고 update 로 바뀐 프로그램에 적용한다.
          supervisorctl -c supervisord.conf reread
          supervisorctl -c supervisord.conf update
          supervisorctl -c supervisord.conf restart inference

      - name: 헬스체크
        run: |
          cd /home/wsuser/app
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8001/healthz && exit 0
            sleep 3
          done
          echo "헬스체크 실패"
          tail -50 inference.err.log
          exit 1

      - name: 실패 시 자동 롤백
        if: failure()
        run: |
          cd /home/wsuser/app
          if [ -z "$PREV_SHA" ]; then
            echo "롤백 지점을 알 수 없음 — 수동 확인 필요"
            exit 1
          fi
          echo "이전 커밋으로 롤백: $PREV_SHA"
          git reset --hard "$PREV_SHA"
          /usr/local/bin/python3.12 -m pip install --user -q -r requirements.txt
          # restart 만으로는 supervisord.conf 변경이 반영되지 않는다.
          # reread 로 파일을 다시 읽고 update 로 바뀐 프로그램에 적용한다.
          supervisorctl -c supervisord.conf reread
          supervisorctl -c supervisord.conf update
          supervisorctl -c supervisord.conf restart inference
          sleep 5
          curl -fsS http://127.0.0.1:8001/healthz \
            && echo "롤백 후 정상 동작 확인" \
            || echo "롤백 후에도 비정상 — 수동 확인 필요"
