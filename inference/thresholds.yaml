# 임계값 — 운영자가 조정하는 값.
#
# 여기 안 적은 항목은 번들 기본값을 쓴다
# (models/us/code/infer_us.py 의 DEFAULTS + configs/us_lora.yaml 의 inference:).
# 적은 항목만 요청마다 predict() 에 넘겨 덮어쓴다.
#
# 값을 하나라도 바꾸면 version 도 반드시 바꿀 것.
# 같은 사진의 결과가 왜 달라졌는지 추적할 수 있는 유일한 단서다.
#
# 최상위 키는 소켓 모듈 이름이다 (sockets/us.py 의 NAME, sockets/mammo.py 의 NAME).
# main.py 가 그 이름으로 꺼내 predict() 에 넘긴다.

# 이 파일의 판. 판독 응답의 threshold_version 으로 그대로 나간다.
version: "2026-08-28.a"

# 초음파 (소켓 4·5) — 한 번의 predict 가 마스크와 등급을 함께 낸다.
us: {}

# 번들의 현재 기본값 (참고용 — 바꾸려면 위 us: 에 적는다)
#
#   threshold        0.5    어느 쿼리를 병변으로 볼지
#   mask_threshold   0.5    어느 화소를 병변으로 볼지
#   polygon_epsilon  0.5    폴리곤 단순화 허용 오차(px)
#   single_query     true   마스크도 argmax 쿼리 하나만
#   t2 0.50   t3 0.50   t4 0.45      CORAL 등급 경계
#   conf_lo 0.10   conf_hi 0.30      확신도 3단계 경계
#
# t4 는 정확도와 안전이 맞바꿔지는 지점이다 (models/us/README.md 6절).
#   0.45 (기본)  정확도 0.532 · BI-RADS 5 재현율 0.889
#   0.95         정확도 0.591 · BI-RADS 5 재현율 0.389
# 정확도가 가장 높은 지점이 임상적으로 가장 위험하다. 근거 없이 올리지 말 것.


# 맘모 (소켓 4b) — 검출 → 서술어 → 규칙표. 한 번의 predict 가 전부 낸다.
mammo: {}

# 번들의 현재 기본값 (참고용 — 바꾸려면 위 mammo: 에 적는다)
# 요청 단위로 덮어쓸 수 있는 것은 아래 넷뿐이다.
#
#   score_calc   0.594   미세석회 점수 문턱
#   score_mass   0.767   종괴 점수 문턱
#   tissue_frac  0.5     박스 면적 중 조직이 차지해야 하는 최소 비율
#   topk         0       최종 병변 개수 제한. 0 = 제한 없음
#
# 두 점수 문턱은 FROC 오탐 1개/영상 지점이고, last_lora.pt 로 잰 값이다.
# 검출기를 바꾸면 이 값이 무의미해진다 — best_lora.pt 는 점수 상한이
# 석회 0.539 · 종괴 0.682 라 여기서 전부 잘린다(실측 6장 전부 기권).
#
# 문턱을 낮추면 놓친 병변을 건질 수 있지만 오탐이 같이 는다.
# detection.candidates 는 수천인데 kept 가 0 이면 「아무것도 없다」가 아니라
# 「점수가 낮아 전부 잘렸다」는 뜻이다 — 그때 낮춰 재요청하는 용도다.