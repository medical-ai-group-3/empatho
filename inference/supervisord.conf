[unix_http_server]
file=%(here)s/supervisor.sock

[supervisord]
logfile=%(here)s/supervisord.log
pidfile=%(here)s/supervisord.pid
childlogdir=%(here)s
nodaemon=false

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(here)s/supervisor.sock

[program:inference]
command=/usr/local/bin/python3.12 -m uvicorn main:app --host 127.0.0.1 --port 8001
directory=%(here)s
autostart=true
autorestart=true
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=%(here)s/inference.out.log
stderr_logfile=%(here)s/inference.err.log
; MODEL_ROOT       가중치 뿌리. models/ 안에 base·us·mammo 가 링크로 붙어 있다
; WEIGHTS_VERSION  healthz 에 그대로 나가는 표시. 아직 판을 매기지 않아 none
; LOAD_US          초음파 적재 허용 (소켓 4·5)
; LOAD_MAMMO       맘모 적재 허용 (소켓 4b)
; KEEP_ALIVE       유휴 이만큼(초) 지나면 프로세스를 끝내 GPU 를 돌려준다.
;                  모든 소켓이 함께 쓴다 — 소켓별로 나누면 한쪽이 판독 중인데
;                  다른 쪽이 프로세스를 끝낸다. 다시 올리는 데 초음파 7초·맘모 17초.
environment=MODEL_ROOT="%(here)s/models",WEIGHTS_VERSION="none",LOAD_US="1",LOAD_MAMMO="1",KEEP_ALIVE="30"

[program:report]
command=/usr/local/bin/python3.12 -m uvicorn report:app --host 127.0.0.1 --port 8002
directory=%(here)s
autostart=true
autorestart=true
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=%(here)s/report.out.log
stderr_logfile=%(here)s/report.err.log