[unix_http_server]
file=%(here)s/supervisor.sock

[supervisord]
logfile=%(here)s/supervisord.log
pidfile=%(here)s/supervisord.pid
childlogdir=%(here)s
nodaemon=false

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(here)s/supervisor.sock

[program:inference]
command=/usr/local/bin/python3.12 -m uvicorn main:app --host 127.0.0.1 --port 8001
directory=%(here)s
autostart=true
autorestart=true
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=%(here)s/inference.out.log
stderr_logfile=%(here)s/inference.err.log
environment=MODEL_ROOT="%(here)s/models",WEIGHTS_VERSION="none",LOAD_US="1",US_KEEP_ALIVE="180"

[program:report]
command=/usr/local/bin/python3.12 -m uvicorn report:app --host 127.0.0.1 --port 8002
directory=%(here)s
autostart=true
autorestart=true
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=%(here)s/report.out.log
stderr_logfile=%(here)s/report.err.log