services:
  orthanc:
    image: orthancteam/orthanc:latest
    container_name: empatho-orthanc
    restart: unless-stopped
    ports:
      - "4242:4242"   # DICOM
      - "8042:8042"   # HTTP / REST / DICOMweb
    volumes:
      - ./orthanc.json:/etc/orthanc/orthanc.json:ro
      - ./orthanc-db:/var/lib/orthanc/db
    environment:
      - ORTHANC__NAME=EMPATHO-MRI-Orthanc
