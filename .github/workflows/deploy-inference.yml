name: deploy-inference

# deploy.yml 이 inference/ 변경 때 부른다. 손으로도 돌릴 수 있다.
#
# 워크스테이션의 INFERENCE_REPO 는 이 통합 레포의 clone 이고, 서버는 그 안의
# inference/ 에서 돈다. git pull · reset 으로 배포 · 롤백한다.
# models/ · replay/ 는 git 밖이라 inference/ 안에 한 번 옮겨 둔다(README 배포 절).
on:
  workflow_call:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, empatho-gpu]
    timeout-minutes: 15
    env:
      REPO: ${{ vars.INFERENCE_REPO || '/home/wsuser/empatho' }}
    steps:
      - name: 배포 전 커밋 기록
        run: |
          set -e
          cd "$REPO"
          echo "PREV_SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV
          echo "롤백 지점: $(git rev-parse --short HEAD)"

      - name: 문법 검사 및 배포
        run: |
          set -e
          cd "$REPO"
          git pull --ff-only
          cd inference
          /usr/local/bin/python3.12 -m py_compile main.py
          /usr/local/bin/python3.12 -m pip install --user -q -r requirements.txt
          # restart 만으로는 supervisord.conf 변경이 반영되지 않는다.
          # reread 로 파일을 다시 읽고 update 로 바뀐 프로그램에 적용한다.
          supervisorctl -c supervisord.conf reread
          supervisorctl -c supervisord.conf update
          supervisorctl -c supervisord.conf restart inference report

      - name: 헬스체크
        run: |
          cd "$REPO/inference"
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8001/healthz && exit 0
            sleep 3
          done
          echo "헬스체크 실패"
          tail -50 inference.err.log
          exit 1

      # 리포트 서버는 별도 프로세스라 8001 이 살아 있어도 죽어 있을 수 있다.
      # supervisor 의 restart 는 기동 실패 전에 돌아오고, 배포의 다른 단계는
      # 8002 를 한 번도 안 본다 — 09-16 에 두 번 그냥 통과했다.
      - name: 리포트 서버 헬스체크
        run: |
          cd "$REPO/inference"
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8002/health && exit 0
            sleep 3
          done
          echo "리포트 서버 헬스체크 실패"
          tail -50 report.err.log
          exit 1

      - name: /analyze 점검
        run: |
          cd "$REPO/inference"
          /usr/local/bin/python3.12 smoke.py

      - name: 실패 시 자동 롤백
        if: failure()
        run: |
          cd "$REPO"
          if [ -z "$PREV_SHA" ]; then
            echo "롤백 지점을 알 수 없음 — 수동 확인 필요"
            exit 1
          fi
          echo "이전 커밋으로 롤백: $PREV_SHA"
          git reset --hard "$PREV_SHA"
          cd inference
          /usr/local/bin/python3.12 -m pip install --user -q -r requirements.txt
          # restart 만으로는 supervisord.conf 변경이 반영되지 않는다.
          # reread 로 파일을 다시 읽고 update 로 바뀐 프로그램에 적용한다.
          supervisorctl -c supervisord.conf reread
          supervisorctl -c supervisord.conf update
          supervisorctl -c supervisord.conf restart inference report 
          sleep 5
          curl -fsS http://127.0.0.1:8001/healthz \
            && curl -fsS http://127.0.0.1:8002/health \
            && echo "롤백 후 정상 동작 확인" \
            || echo "롤백 후에도 비정상 — 수동 확인 필요"
