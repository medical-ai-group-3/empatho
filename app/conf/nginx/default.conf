# ── EMPATHO 앞단 ────────────────────────────────────────────────────
#
# 「앱 서버 nginx 작업 요청서」(2026-09-09) 의 2·3절을 그대로 구현한다.
#
#   conf/nginx/  →  /etc/nginx/conf.d/   (폴더째. 이 파일이 default.conf)
#
# .gitignore 의 *.env · conf/garage/garage.toml · conf/orthanc.env 어디에도
# 안 걸린다. 커밋된다 — 확인했다.
#
# 값의 근거는 gosvc 소스에 있다. 짐작으로 넣은 숫자가 없다.
#   llm-proxy   genCtx 10*time.Minute         → 660s
#   notify      stream 은 계속 열어 두는 통로  → 24h (인수 조건 60초 충족)
#   업로드      한도는 티켓의 max_bytes        → nginx 는 안 자른다
# ────────────────────────────────────────────────────────────────────


# 도커 내장 DNS. **이 줄이 없으면 배포마다 502 가 난다.**
#
# proxy_pass 에 이름을 그대로 쓰면 nginx 는 기동할 때 딱 한 번 풀고 그 IP 를
# 계속 쓴다. deploy.yml 이 up -d --build 를 돌리면 web·gosvc 는 새로 떠서
# IP 가 바뀌는데 nginx 는 안 바뀌니 재생성되지 않는다 → 옛 IP 를 계속 두드린다.
#
# 그래서 업스트림을 변수로 두고 valid=10s 로 다시 풀게 한다. 변수를 쓰면
# nginx 가 경로를 안 이어 주므로 $request_uri 를 직접 붙인다.
resolver 127.0.0.11 valid=10s ipv6=off;

# 걸린 시간을 남긴다 — 느린 자리를 여기서 먼저 본다.
# ⚠ log_format 은 http 구역에만 쓸 수 있다. server 안에 넣으면
#   "log_format directive is not allowed here" 로 **nginx 가 아예 안 뜬다.**
log_format timed '$remote_addr "$request" $status $body_bytes_sent '
                 'upstream=$upstream_addr '
                 'req=$request_time upstream_time=$upstream_response_time';

server {
    # ⚠ 요청서는 443 이라고 적혀 있는데 우리는 HTTP 로 가기로 했다.
    #   443 은 브라우저가 https 로 여는 포트다. 인증서 없이 443 에 평문을
    #   올리면 https:// 로 접속한 사람은 **연결 자체가 실패한다.**
    #   아래 TLS 구역을 살릴지 팀장과 정하고 나서 고친다.
    listen      80;
    server_name _;

    client_max_body_size 32m;   # 기본 상한. 업로드 구역에서만 푼다
    access_log /var/log/nginx/access.log timed;

    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    # SSE 를 쓰려면 비워야 한다. 기본값(close)이면 스트림이 매번 끊긴다.
    proxy_set_header   Connection        "";

    # ⚠ CORS 헤더를 여기서 붙이지 말 것.
    #   Go 가 internal/httpx/cors.go 에서, Django 가 corsheaders 로 이미
    #   붙인다. 두 번 붙으면 헤더가 중복되고 **브라우저가 그걸 거부한다.**
    #   오류가 「헤더가 없다」가 아니라 「중복이다」로 나와 원인을 못 찾는다.


    # ── 내부 콜백 차단 (요청서 2·3절) ───────────────────────────────
    # Go → Django 콜백 전용이다. CALLBACK_BASE=http://web:8000 이라
    # 도커 네트워크 안에서만 오간다 — nginx 를 거칠 일이 없다.
    #
    # **이 구역이 없으면 아래 SPA 구역으로 떨어져 index.html 이 200 으로
    # 돌아간다.** 차단이 아니라 「엉뚱한 200」이라 더 나쁘다.
    # 있다는 사실도 알리지 않도록 403 이 아니라 404 로 준다.
    location /internal/ {
        access_log off;
        return 404;
    }

    # nginx 자신이 살아 있는지 보는 자리. 업스트림을 안 거친다.
    # healthcheck 가 /svc/v1/health 를 보면 file-gateway 가 죽었을 때
    # **nginx 가 불건강으로 표시된다** — 원인을 엉뚱한 데서 찾게 된다.
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }


    # ── llm-proxy ───────────────────────────────────────────────────
    # 서술 생성에 최대 10분을 쓴다. 기본 60초로 두면 nginx 가 먼저 끊는데,
    # Go 는 요청 컨텍스트에 안 묶여 있어 끝까지 돌고 콜백까지 한다 —
    # **화면에서만 실패로 보인다.** 제일 찾기 어려운 고장이다.
    location /svc/v1/llm/ {
        set        $up_llm llm-proxy;
        proxy_pass http://$up_llm:8090$request_uri;

        proxy_read_timeout  660s;
        proxy_send_timeout  660s;
        proxy_buffering     off;   # report-narrative · chat 이 SSE 다
        proxy_cache         off;
    }

    # ── notify · 스트림 ─────────────────────────────────────────────
    # 접두사가 더 길어 nginx 가 알아서 이쪽을 먼저 고른다 — 순서 무관.
    location /svc/v1/notify/stream {
        set        $up_ntf_s notify;
        proxy_pass http://$up_ntf_s:8092$request_uri;

        proxy_read_timeout  24h;
        proxy_send_timeout  24h;
        proxy_buffering     off;
        proxy_cache         off;
    }

    # ── notify · 나머지 ─────────────────────────────────────────────
    location /svc/v1/notify/ {
        set        $up_ntf notify;
        proxy_pass http://$up_ntf:8092$request_uri;
        proxy_read_timeout 60s;
    }

    # ── file-gateway · 업로드 ───────────────────────────────────────
    # 한도는 티켓의 max_bytes 가 요청마다 정한다. nginx 에 고정 상한을 두면
    # **티켓이 허용해도 nginx 가 먼저 413 을 낸다.**
    #
    # request_buffering off 가 중요하다. 켜 두면 nginx 가 본문을 전부 디스크에
    # 받은 뒤에야 Go 에 넘긴다 — 큰 DICOM·WSI 에서 시간이 두 배가 되고
    # 디스크도 두 번 쓴다.
    location /svc/v1/upload/ {
        set        $up_gw_u file-gateway;
        proxy_pass http://$up_gw_u:8091$request_uri;

        client_max_body_size    0;
        proxy_request_buffering off;
        proxy_read_timeout      600s;
        proxy_send_timeout      600s;
    }

    # POST /svc/v1/files  ·  GET /svc/v1/files/{key...}
    # Range 요청이 온다(타일 뷰어). 기본 동작으로 통과한다.
    location /svc/v1/files {
        set        $up_gw_f file-gateway;
        proxy_pass http://$up_gw_f:8091$request_uri;

        client_max_body_size    0;
        proxy_request_buffering off;
        proxy_read_timeout      600s;
        proxy_send_timeout      600s;
    }

    # GET /svc/v1/derived/{key...} - 화면이 MRI 메시 같은 파생물을 받는다 
    # 올리기 POST 는 워커가 Docker 내부에서 file-gateway 로 바로 하므로 밖에는 열지 않는다 
    location /svc/v1/derived/ {
        limit_except GET { deny all; }
        set $up_gw_d file-gateway;
        proxy_pass http://$up_gw_d:8091$request_uri;
        proxy_read_timeout      600s;
    }

    # 이 경로는 file-gateway 것이다. llm·notify 는 각자
    # /svc/v1/llm/health · /svc/v1/notify/health 를 따로 갖고 있다.
    location = /svc/v1/health {
        set        $up_gw_h file-gateway;
        proxy_pass http://$up_gw_h:8091$request_uri;
    }


    # ── Django ──────────────────────────────────────────────────────
    # 요청서는 /api/v1/* 이다. /api/ 로 잡아 두면 그것을 포함하면서
    # 나중에 판이 올라가도 설정을 안 고쳐도 된다.
    location /api/ {
        set        $up_web_a web;
        proxy_pass http://$up_web_a:8000$request_uri;
        proxy_read_timeout 120s;
    }

    location /admin/ {
        set        $up_web_b web;
        proxy_pass http://$up_web_b:8000$request_uri;
    }

    # admin 정적 파일은 **whitenoise 가 Django 안에서 준다.**
    # (settings.py 의 WhiteNoiseMiddleware · Dockerfile 의 collectstatic)
    #
    # nginx 가 파일로 직접 주려 하면 그 파일이 nginx 컨테이너에 없어서
    # admin 화면의 CSS 가 통째로 404 가 된다. 그대로 web 으로 넘긴다.
    # 이 구역이 없으면 아래 SPA 구역으로 떨어져 **index.html 이 CSS 인 척
    # 돌아온다** — 그게 더 헷갈린다.
    location /static/ {
        set        $up_web_s web;
        proxy_pass http://$up_web_s:8000$request_uri;
        access_log off;
    }


    # ── 프런트 ──────────────────────────────────────────────────────
    #
    # ⚠ 네이티브 앱(React Native·Flutter)으로 갈 거면 **이 구역을 통째로
    #   지운다.** 그때는 브라우저가 아니라 정적 파일도 CORS 도 필요 없고,
    #   nginx 는 API 앞단 역할만 한다.
    #
    # Vite 빌드 결과(dist)를 web-dist/ 에 넣는다.
    # try_files 의 마지막 /index.html 이 SPA 새로고침을 살린다 — 없으면
    # 주소창에 /result 를 직접 치거나 F5 를 누를 때 404 가 난다.
    location / {
        root      /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;

        # index.html 은 캐시하지 않는다. 배포해도 옛 화면이 남는다.
        location = /index.html {
            add_header Cache-Control "no-store";
        }
    }
}


# ── TLS 로 갈 때 (지금은 안 씀) ──────────────────────────────────────
#
# 사내망 IP(app-host)로는 공인 인증서를 못 받는다 — 도메인이 있어야
# 한다. 자체 서명으로 하면 접속할 때마다 「위험함」 경고 화면이 뜬다.
# 시연 첫 화면이 경고문이 되므로 지금은 HTTP 로 간다.
#
# 살릴 때 — 인증서를 만들고
#   openssl req -x509 -newkey rsa:2048 -nodes -days 365 \
#     -keyout conf/tls.key -out conf/tls.crt \
#     -subj "/CN=app-host" \
#     -addext "subjectAltName=IP:app-host"
#
# compose 에 볼륨을 붙인 뒤 위 server 의 listen 을 지우고 아래를 쓴다.
#
# server {
#     listen 443 ssl;
#     http2  on;
#     server_name _;
#     ssl_certificate     /etc/nginx/tls/tls.crt;
#     ssl_certificate_key /etc/nginx/tls/tls.key;
#     ... 위 location 들을 그대로 ...
# }
# server {                       # 80 은 443 으로 넘긴다
#     listen 80;
#     return 301 https://$host$request_uri;
# }
