name: empatho-server

services:
  garage:
    image: dxflrs/garage:v2.3.0
    container_name: garage
    restart: unless-stopped
    ports:
      - "127.0.0.1:3900:3900"
      - "127.0.0.1:3903:3903"
    volumes:
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
      - ./conf/garage.toml:/etc/garage.toml:ro

  orthanc:
    image: orthancteam/orthanc:26.8.1
    container_name: orthanc
    restart: unless-stopped
    env_file:
      - ./conf/orthanc.env
    ports:
      - "127.0.0.1:8042:8042"
    volumes:
      - orthanc-index:/var/lib/orthanc/index
      - orthanc-storage:/var/lib/orthanc/storage

  postgres: 
    image: postgres:17
    container_name: postgres
    restart: unless-stopped
    env_file:
      - ./conf/postgres.env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  garage-meta:
  garage-data:
  orthanc-index:
  orthanc-storage:
  postgres-data: 
