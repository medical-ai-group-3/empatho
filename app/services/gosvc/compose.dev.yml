# 개발용 덮어쓰기 — Garage · Django · Orthanc 없이 Docker 만으로 전 경로를 태운다.
#
#   docker compose -f compose.gosvc.yml -f compose.dev.yml up --build -d
#   docker compose -f compose.gosvc.yml -f compose.dev.yml logs -f fake-django
#
# 그리고 점검:
#   docker compose -f compose.gosvc.yml -f compose.dev.yml run --rm devkit
#
# ⚠ 이 파일은 **개발 전용**이다. 운영 compose 에 섞지 말 것.
#    저장소가 컨테이너 볼륨이라 Garage 를 안 쓴다.
#
# ⚠ 두 compose 파일 모두 **저장소 루트**에 두고 실행한다.
#    build context 가 ./gosvc 라서 그렇다. gosvc/ 안에서 실행하면
#    ./gosvc/gosvc 를 찾다가 실패한다.

services:
  file-gateway:
    environment:
      # 개발용 로컬 디스크. GW_DEV=1 이 없으면 기동을 거부하도록 막아 뒀다.
      GW_LOCAL_ROOT: /data
      GW_DEV: "1"
      CALLBACK_BASE: http://fake-django:9999
      CALLBACK_SECRET: ${CALLBACK_SECRET:-dev-secret}
      TICKET_KEY: ${TICKET_KEY:-dev-key}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      GARAGE_ACCESS_KEY: ""
      GARAGE_SECRET_KEY: ""
      ORTHANC_URL: ""
    volumes:
      - gw-dev-store:/data
    depends_on:
      - fake-django

  llm-proxy:
    environment:
      CALLBACK_BASE: http://fake-django:9999
      CALLBACK_SECRET: ${CALLBACK_SECRET:-dev-secret}
      TICKET_KEY: ${TICKET_KEY:-dev-key}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    depends_on:
      - fake-django

  notify:
    environment:
      CALLBACK_BASE: http://fake-django:9999
      CALLBACK_SECRET: ${CALLBACK_SECRET:-dev-secret}
      TICKET_KEY: ${TICKET_KEY:-dev-key}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    depends_on:
      - fake-django

  # Django 자리를 대신한다. 내부 콜백(I-1~I-4)을 받아 로그로 찍는다.
  # ⚠ --host 0.0.0.0 이어야 다른 컨테이너가 붙는다. 기본값 127.0.0.1 은
  #   컨테이너 안에서는 자기 자신만 가리킨다.
  fake-django:
    image: python:3.12-alpine
    working_dir: /tools
    volumes:
      - ./gosvc/tools:/tools:ro
    command: >
      python3 fake_django.py --host 0.0.0.0 --port 9999
      --secret ${CALLBACK_SECRET:-dev-secret}
    restart: unless-stopped

  # 점검 도구. 평소에는 안 뜨고 run 으로만 부른다.
  #
  #   docker compose ... run --rm devkit
  #
  # 시험용 DICOM 을 컨테이너 안에서 만들어 쓴다. **실제 의료영상을 쓰지 않는다** —
  # CBIS 는 재배포 금지고 VinDr·EMBED 는 인증·DUA 로 묶여 있어 개인 컴퓨터로
  # 옮기면 안 된다.
  devkit:
    image: python:3.12-alpine
    working_dir: /tools
    volumes:
      - ./gosvc/tools:/tools:ro
    profiles: ["tools"]
    environment:
      GW: http://file-gateway:8091
      TICKET_KEY: ${TICKET_KEY:-dev-key}
    command: >
      sh -c "python3 make_test_dicom.py /tmp/t.dcm &&
             python3 smoke.py --gw $$GW --key $$TICKET_KEY --file /tmp/t.dcm &&
             python3 smoke_chunked.py $$GW $$TICKET_KEY /tmp/t.dcm 8"

volumes:
  gw-dev-store:
