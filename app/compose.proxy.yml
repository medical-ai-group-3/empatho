# 앞단. 다른 둘과 이름이 같아야 한 네트워크에 들어간다.
name: empatho-server

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    restart: unless-stopped

    # **밖에 열리는 유일한 포트다.**
    # 다른 서비스의 127.0.0.1 바인딩은 그대로 둔다 — 지우면 안 된다.
    #
    # 80 도 계속 연다. 둘 다 필요하다 —
    #   · certbot 이 발급·갱신할 때 80 으로 확인하러 온다
    #   · http:// 로 들어온 사람을 https 로 넘겨야 한다
    ports:
      - "80:80"
      - "443:443"

    volumes:
      # 폴더째 붙인다. 파일 하나를 붙이면 Docker Desktop 재시작 때 마운트가 끊겨
      # nginx 가 안 뜬다(2026-09-14). conf/nginx/ 에는 default.conf 하나만 둔다.
      - ./conf/nginx:/etc/nginx/conf.d:ro
      # Vite 빌드 결과. 네이티브 앱으로 가면 이 줄과 nginx.conf 의
      # 프런트 구역을 같이 지운다.
      - ./web-dist:/usr/share/nginx/html:ro
      # Django 정적 파일은 붙이지 않는다 — whitenoise 가 Django 안에서
      # 준다(settings.py). nginx 는 /static/ 을 web 으로 넘기기만 한다.

      # 인증서. certbot 컨테이너가 쓰고 nginx 는 읽기만 한다.
      # ⚠ 이 폴더는 git 에 안 올라간다(.gitignore) — 개인키가 들어 있다.
      #   배포 때 지워지지도 않는다. checkout 은 추적되는 파일만 건드린다.
      - ./conf/certbot/etc:/etc/letsencrypt:ro
      # certbot 이 확인 파일을 놓는 자리. 80 의 acme-challenge 가 여기를 본다.
      - ./conf/certbot/www:/var/www/certbot:ro

    # ⚠ **6시간마다 스스로 재적재한다.**
    #   certbot 이 인증서를 갱신해도 nginx 는 뜰 때 읽은 것을 메모리에
    #   들고 있다. 그대로 두면 갱신은 됐는데 브라우저에는 **만료된 인증서**가
    #   내려간다 — 90일 뒤 조용히 터지고, 그때는 아무도 이 파일을 안 보고
    #   있을 것이다.
    #
    #   reload 는 끊김이 없다. 처리 중인 요청은 그대로 끝내고 새 요청부터
    #   새 설정으로 받는다.
    command: >
      /bin/sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done &
                  nginx -g 'daemon off;'"

    # 이름을 풀 수 있으면 되므로 기동 순서까지 맞출 필요는 없다.
    # nginx 는 못 붙으면 502 를 내고 다음 요청에 다시 시도한다.
    depends_on:
      - web
      - llm-proxy
      - file-gateway
      - notify

    # nginx 자신만 본다. /svc/v1/health 를 보면 file-gateway 가 죽었을 때
    # nginx 가 불건강으로 표시돼 원인을 엉뚱한 데서 찾게 된다.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── 인증서 갱신 ───────────────────────────────────────────────────
  #
  # 발급은 사람이 한 번 손으로 한다(docs/nginx.md). 여기서는 **갱신만**
  # 맡는다 — Let's Encrypt 인증서는 90일이라 시연 뒤에도 계속 돈다.
  #
  # 12시간마다 깨어나 만료가 30일 안으로 들어왔는지 본다. 아니면 아무 일도
  # 안 하고 다시 잔다. 매번 발급을 시도하는 게 아니라 안전하다.
  #
  # ⚠ 갱신해도 nginx 는 옛 인증서를 메모리에 들고 있다. 그래서 갱신 뒤
  #   reload 를 걸어야 하는데, certbot 컨테이너에서 nginx 컨테이너를
  #   재적재할 방법이 없다. 그 일은 nginx 쪽이 맡는다 (아래 주석 참고).
  certbot:
    image: certbot/certbot:v5.1.0
    container_name: certbot
    restart: unless-stopped
    volumes:
      - ./conf/certbot/etc:/etc/letsencrypt
      - ./conf/certbot/www:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM;
             while :; do
               certbot renew --webroot -w /var/www/certbot --quiet;
               sleep 12h & wait $${!};
             done"
