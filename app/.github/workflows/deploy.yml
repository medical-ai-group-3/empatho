name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# 세 파일을 매번 -f 로 넘기면 길어지고 한 곳만 빠뜨리기 쉽다.
# docker compose 가 이 변수를 알아서 읽는다.
env:
  COMPOSE_FILE: compose.server.yml:compose.app.yml:compose.proxy.yml
  # 런타임 상태는 체크아웃 밖에 둔다. checkout 이 git clean -ffdx 로
  # 무시된 파일까지 지우기 때문에, 안에 두면 배포마다 사라진다
  CONF: /home/runner/empatho-conf
  WEB_DIST: /home/runner/empatho-web

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      
      # 사람이 서버에서 손으로 docker compose 를 칠 때를 위해 .env 를 남긴다.
      # compose 가 자동으로 읽는 파일이라, 이게 없으면 위 CONF·WEB_DIST 가
      # 안 잡혀서 기본값(./conf)으로 떨어진다 — 그 폴더는 이제 비어 있다.
      - name: compose 가 읽을 .env 를 쓴다
        run: printf 'CONF=%s\nWEB_DIST=%s\n' "$CONF" "$WEB_DIST" > .env
      # --build 가 붙는 이유 — Django 와 Go 는 우리 코드로 이미지를 만든다.
      # postgres 처럼 받아 쓰는 것과 다르다.
      - run: docker compose up -d --build

      # 표 구조를 맞춘다. makemigrations 는 여기서 돌리지 않는다 —
      # 파일이 서버에만 생겨서 다음 배포 때 사라진다.
      - run: docker compose run --rm web python manage.py migrate

      # up -d 는 컨테이너가 죽었다 살아나기를 반복해도 0 으로 끝난다.
      # Go 셋은 환경변수가 하나만 없어도 log.Fatal 로 즉시 죽는다.
      - run: |
          sleep 15
          docker compose ps
          bad=$(docker compose ps --status restarting -q)
          if [ -n "$bad" ]; then docker compose logs --tail 30 $bad; exit 1; fi

      # ── 여기부터 nginx (요청서 6절) ──────────────────────────────
      #
      # nginx 는 설정이 틀려도 컨테이너가 살아 있는 채로 502 만 뱉는
      # 경우가 있다. 위 「재시작 반복」 검사로는 안 잡힌다.
      # ⚠ 돌고 있는 nginx 안에서 검사하면 안 된다(exec). 배포 중에 내용이
      #   바뀐 폴더 마운트(conf/certbot)가 그 컨테이너에서는 낡아서, 멀쩡한
      #   인증서를 「없다」며 검사가 실패한다 — 09-17 에 두 번 그랬다.
      #   run --rm 은 같은 마운트로 **새 컨테이너**를 띄우므로 실제 상태를 본다.
      - name: nginx 설정 문법 (새 컨테이너에서)
        run: docker compose run --rm --no-deps -T nginx nginx -t
        # 설정만 바뀐 배포에서는 compose 가 nginx 를 다시 만들지 않는다.
        # 폴더 마운트라 파일은 새것이지만 nginx 는 옛 설정으로 돈다 —
        # 새 경로가 404 로 남았다. 그래서 문법 검사 뒤에 반드시 반영시킨다.
        #
        # ⚠ reload 가 아니라 **다시 만든다.** Docker Desktop(WSL2) 에서는
        #   conf/certbot 처럼 배포 중에 내용이 바뀐 폴더 마운트가 낡아서,
        #   reload 를 걸면 nginx 가 인증서를 못 읽고 **리스너를 놓아 버린다**
        #   — 프로세스는 살아 있고 healthcheck 도 통과하는데 80·443 을 아무도
        #   안 듣는 상태가 된다. 09-17 에 실제로 그렇게 됐고 밖에서는 연결
        #   거부로만 보여 원인을 찾기 어려웠다.
        #   recreate 는 1~2초 끊기지만 확실하다.
      - name: nginx 반영 (다시 만든다)
        run: docker compose up -d --force-recreate nginx

      - name: 인수 조건 확인
        run: |
          set -eu
          B=https://127.0.0.1
          code() { curl -sk -o /dev/null -w '%{http_code}' --max-time 20 "$@"; }

          # ① nginx 자신. 업스트림을 안 거친다
          [ "$(code $B/nginx-health)" = 200 ] || { echo "nginx 죽음"; exit 1; }

          # ② Go 3종 — 각자 health 를 갖고 있다
          for p in /svc/v1/health /svc/v1/llm/health /svc/v1/notify/health; do
            c=$(code "$B$p")
            [ "$c" = 200 ] || { echo "$p → $c"; exit 1; }
          done

          # ③ Django — 로그인으로 넘기는 302 가 정상이다
          c=$(code $B/admin/)
          case "$c" in
            200|302) ;;
            400) echo "/admin/ → 400 · $CONF/web.env 의 DJANGO_ALLOWED_HOSTS 를 확인"; exit 1 ;;
            *)   echo "/admin/ → $c"; exit 1 ;;
          esac

          # ④ 내부 콜백 차단. Go → Django 전용이라 밖에 열리면 안 된다
          c=$(code $B/internal/v1/ping)
          case "$c" in
            403|404) ;;
            *) echo "/internal/v1/ 이 $c 로 열려 있다"; exit 1 ;;
          esac

          # ⑤ 대용량 업로드 — 413 이 안 나야 한다.
          #    티켓이 없으니 401·403 이 정상이다. **본문을 다 받고 나서**
          #    거절해야 통과다. 413 이면 nginx 가 먼저 자른 것이다.
          head -c 104857600 /dev/zero > /tmp/100mb.bin
          c=$(code -X POST -H 'Content-Type: application/octet-stream' \
                   --data-binary @/tmp/100mb.bin $B/svc/v1/files)
          rm -f /tmp/100mb.bin
          [ "$c" != 413 ] || { echo "100MB 에서 413 · client_max_body_size 확인"; exit 1; }

          echo "인수 조건 통과"

      # SSE 가 흘러나오는지. 티켓이 없어 401 로 끊길 수 있으므로
      # **실패해도 배포는 안 막는다** — 로그로만 남긴다.
      - name: SSE 확인 (참고)
        continue-on-error: true
        run: timeout 65 curl -Nsk https://127.0.0.1/svc/v1/notify/stream | head -c 400 || true
